  </g>
  <g font-family="'Plus Jakarta Sans','Segoe UI',sans-serif">
    <text x="65" y="31" fill="#f7f7f3" font-size="24" font-weight="800" letter-spacing="-.8">CINE<tspan fill="#e6f000">VERSE</tspan></text>
    <text x="66" y="44" fill="#777b82" font-size="6.6" font-weight="700" letter-spacing="2.7">FILM · STORIES · DISCOVERY</text>
  </g>
</svg>
