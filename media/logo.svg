<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 45" width="240" height="45">
  <defs>
    <linearGradient id="cvGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8" />
      <stop offset="50%" stop-color="#007CF0" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="240" height="45" rx="10" fill="#090d16" />
  
  <!-- Film Icon Emblem -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="28" height="28" rx="6" fill="url(#cvGrad)" />
    <polygon points="11,8 21,14 11,20" fill="#090d16" />
  </g>
  
  <!-- Brand Text -->
  <text x="48" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" letter-spacing="1" fill="#FFFFFF">CINE<tspan fill="url(#cvGrad)" filter="url(#neonGlow)">VERSE</tspan></text>
  <text x="49" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7.5" letter-spacing="2.5" fill="#64748b">MOVIES &amp; TV EXPLORER</text>
</svg>
