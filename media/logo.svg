<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 286 56" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">CineVerse</title>
  <desc id="logoDesc">Emblema cinematográfico y logotipo CineVerse</desc>
  <defs>
    <linearGradient id="gold" x1="6" y1="5" x2="48" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7ff3f"/><stop offset=".52" stop-color="#e6f000"/><stop offset="1" stop-color="#aeb800"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="28" cy="28" r="24" fill="#111317" stroke="url(#edge)"/>
    <circle cx="28" cy="28" r="18.5" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="77 40" stroke-linecap="round" transform="rotate(-38 28 28)"/>
    <path d="M20 17.5v21l20-10.5-20-10.5Z" fill="url(#gold)"/><path d="M24 21.5v13l12.4-6.5L24 21.5Z" fill="#0a0b0d"/>
