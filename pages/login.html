<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CineVerse</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <header class="header-principal auth-header">
        <div class="header-container">
            <a href="../index.html" class="logo-container" title="Inicio CineVerse Explorer"><img src="../media/logo.svg" alt="CineVerse Logo" class="logo-img"></a>
            <nav class="nav-principal" aria-label="Navegación principal"><ul class="nav-lista"><li class="nav-item"><a href="peliculas.html" class="nav-link">Películas</a></li><li class="nav-item"><a href="series.html" class="nav-link">Series de TV</a></li><li class="nav-item"><a href="personas.html" class="nav-link">Personas</a></li><li class="nav-item"><a href="awards.html" class="nav-link">Awards</a></li></ul></nav>
            <div id="authMenu" class="nav-user"></div>
        </div>
    </header>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="********">
                </div>
                <div id="authError" class="auth-error-msg hidden">Credenciales inválidas</div>
                <button type="submit" class="btn-primary auth-submit">Entrar a CineVerse</button>
            </form>
            <p class="auth-redirect">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>
    </div>
    
    <script src="../js/auth.js"></script>
</body>
</html>
