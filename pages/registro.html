<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - CineVerse</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <a href="../index.html" class="auth-logo-link" style="text-decoration: none;">
            <div class="logo">
                <i class="fa-solid fa-play"></i>
                <div class="logo-texto">
                    CINE<span>VERSE</span>
                    <span class="logo-sub">MOVIES & TV EXPLORER</span>
                </div>
            </div>
        </a>
        <div class="auth-card">
            <h2>Crear Cuenta</h2>
            <form id="registroForm" class="auth-form">
                <div class="form-group">
                    <label for="fullName">Nombre Completo</label>
                    <input type="text" id="fullName" required placeholder="Ej. Juan Pérez">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="Mínimo 6 caracteres" minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" required placeholder="Mínimo 6 caracteres" minlength="6">
                </div>
                <div id="authError" class="auth-error-msg hidden"></div>
                <button type="submit" class="btn-primary auth-submit">Registrarse</button>
            </form>
            <p class="auth-redirect">¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a></p>
        </div>
    </div>
    
    <script src="../js/auth.js"></script>
</body>
</html>
