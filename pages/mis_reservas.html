<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas - CineVerse</title>
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mis_reservas.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-play"></i>
                CINEVERSE
            </a>
            
            <nav class="nav-links">
                <a href="../index.html">Películas</a>
                <a href="../index.html">Series de TV</a>
            </nav>

            <div id="authMenu" class="nav-user">
                <!-- Se inyecta vía JS (Dropdown de Perfil) -->
            </div>
        </div>
    </header>

    <main class="reservas-container">
        <div class="reservas-header">
            <h1><i class="fa-solid fa-ticket"></i> Mis Reservas</h1>
            <p>Historial de tus boletos de CineVerse.</p>
        </div>

        <div id="ticketsContainer" class="tickets-grid">
            <!-- Los tickets se cargarán aquí -->
            <div class="loading-spinner">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Cargando reservas...
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/mis_reservas.js"></script>
</body>
</html>
